name: liaison
version: 0.2.0
license: MPL2

crystal: ">= 1.19, < 2.0"

description: >
  Liaison is a Crystal shard for applications that talk to LLMs, anchored
  by a portable session history that can be used to start a conversation
  with one provider and continue it with another.

authors:
  - nogginly@icloud.com

targets:
  liaison:
    main: src/liaison_cli.cr

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: ">= 1.7.0"
  wiretap:
    # Records live HTTP once, replays offline forever.
    github: nogginly/wiretap.cr
    version: ">= 0.4.1"
